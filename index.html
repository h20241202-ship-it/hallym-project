<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>강원이어라 · 강원 원도심 빈 상가와 청년을 잇는 공간 매칭</title>
<meta name="description" content="강원 원도심 빈 상가를 지도에서 찾고, AI가 건물주를 설득하는 제안서를 써 드려요.">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap">
<style>
/* 강원이어라 · 깔끔한 금융앱 톤: 흰 바탕, 큰 굵은 제목, 파란 강조, 둥근 카드
   건물 모티프: 불 켜지는 창문(노랑) = 빈 상가가 채워짐
   휴대폰 화면은 실제 앱(gangwonieora.vercel.app)의 남색·초록을 따름 */
:root {
  --blue: #3182f6;
  --blue-d: #1b64da;
  --blue-50: #e8f3ff;
  --blue-100: #c9e2ff;
  --g900: #191f28;
  --g800: #333d4b;
  --g700: #4e5968;
  --g600: #6b7684;
  --g500: #8b95a1;
  --g400: #b0b8c1;
  --g300: #d1d6db;
  --g200: #e5e8eb;
  --g100: #f2f4f6;
  --g50: #f9fafb;
  --win-on: #ffd66b;
  --win-off: #cfd8e3;
  --wall: #e3ebf6;
  --wall-2: #d3dfee;
  --red: #f04452;
  --green: #03b26c;
  --r-sm: 12px;
  --r: 18px;
  --r-lg: 26px;
  --shadow: 0 2px 10px rgba(0, 27, 55, 0.06);
  --shadow-lg: 0 12px 32px rgba(0, 27, 55, 0.10);
  --font: "Pretendard", "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme: light;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: #fff; color: var(--g900); font-family: var(--font);
  font-size: 16px; line-height: 1.6; letter-spacing: -0.01em;
  word-break: keep-all; overflow-wrap: break-word; -webkit-font-smoothing: antialiased;
}
img, svg { display: block; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
h1, h2, h3, h4, p { margin: 0; }
h1, h2, h3 { letter-spacing: -0.03em; line-height: 1.3; text-wrap: balance; }
:focus-visible { outline: 3px solid var(--blue-100); outline-offset: 2px; border-radius: 8px; }
main:focus { outline: none; }

.skip { position: absolute; left: -999px; top: 8px; z-index: 100; background: var(--g900); color: #fff; padding: 8px 14px; border-radius: 8px; }
.skip:focus { left: 8px; }

.container { max-width: 1080px; margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left)); padding-right: max(20px, env(safe-area-inset-right)); }

/* ---------- 상단 바 ---------- */
.topbar { position: sticky; top: 0; z-index: 50; background: rgba(255, 255, 255, 0.86); backdrop-filter: saturate(180%) blur(14px); -webkit-backdrop-filter: saturate(180%) blur(14px); border-bottom: 1px solid transparent; transition: border-color .2s; }
.topbar.scrolled { border-bottom-color: var(--g200); }
.topbar-in { max-width: 1080px; margin: 0 auto; height: 64px; padding: 0 20px; display: flex; align-items: center; gap: 28px; }
.logo { display: inline-flex; align-items: center; gap: 8px; font-weight: 800; font-size: 20px; letter-spacing: -0.04em; }
.logo-mark { width: 28px; height: 28px; border-radius: 8px; background: #0f3d6e; color: #fff; font-size: 11.5px; font-weight: 800; letter-spacing: -0.05em; display: grid; place-items: center; }
.topnav { display: flex; gap: 4px; flex: 1; }
.topnav a { font-size: 15px; font-weight: 500; color: var(--g700); padding: 8px 12px; border-radius: 10px; transition: background .15s, color .15s; }
.topnav a:hover { background: var(--g100); }
.topnav a.on { color: var(--g900); font-weight: 700; }
.nav-more { position: relative; }
.nav-more-btn { display: inline-flex; align-items: center; gap: 4px; font-size: 15px; font-weight: 500; color: var(--g700); padding: 8px 12px; border-radius: 10px; transition: background .15s, color .15s; }
.nav-more-btn svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; transition: transform .15s; }
.nav-more-btn:hover, .nav-more.open .nav-more-btn { background: var(--g100); }
.nav-more-btn.on { color: var(--g900); font-weight: 700; }
.nav-more.open .nav-more-btn svg { transform: rotate(180deg); }
.nav-menu { position: absolute; top: calc(100% + 8px); left: 0; width: 300px; background: #fff; border-radius: var(--r); box-shadow: var(--shadow-lg); padding: 10px; display: none; gap: 2px; z-index: 60; }
.nav-more.open .nav-menu { display: grid; }
.topnav .nav-menu a.nm-all { background: var(--blue-50); margin-bottom: 4px; }
.nav-menu-head { font-size: 12.5px; font-weight: 700; color: var(--g500); padding: 6px 10px 4px; }
.topnav .nav-menu a { display: grid; gap: 2px; padding: 10px; }
.nav-menu .nm-t { display: flex; align-items: center; gap: 6px; font-weight: 700; color: var(--g900); }
.nav-menu .nm-t em { font-style: normal; font-size: 11.5px; font-weight: 700; color: #a86b00; background: #fff4d6; border-radius: 6px; padding: 1px 6px; }
.nav-menu .nm-d { font-size: 13px; color: var(--g600); font-weight: 400; }
.roadmap-note { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px; background: #fff4d6; color: #7a4e00; border-radius: var(--r-sm); padding: 12px 16px; font-size: 14.5px; font-weight: 600; justify-self: start; }
.roadmap-note b { font-weight: 800; }

/* ---------- 버튼 ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 56px; padding: 0 24px; border-radius: 16px; font-size: 17px; font-weight: 700; transition: background .15s, transform .1s; white-space: nowrap; }
.btn:active { transform: scale(0.98); }
.btn-primary { background: var(--blue); color: #fff; }
.btn-primary:hover { background: var(--blue-d); }
.btn-soft { background: var(--blue-50); color: var(--blue-d); }
.btn-soft:hover { background: var(--blue-100); }
.btn-grey { background: var(--g100); color: var(--g800); }
.btn-grey:hover { background: var(--g200); }
.btn-sm { height: 40px; padding: 0 14px; border-radius: 12px; font-size: 14px; }
.btn-block { width: 100%; }
.btn[disabled] { background: var(--g200); color: var(--g500); cursor: not-allowed; }

/* ---------- 공통 ---------- */
.section { padding: 88px 0; }
.section.tint { background: var(--g50); }
.eyebrow { font-size: 15px; font-weight: 700; color: var(--blue); margin-bottom: 10px; }
.title-xl { font-size: clamp(36px, 6vw, 56px); font-weight: 800; letter-spacing: -0.04em; line-height: 1.22; }
.title-lg { font-size: clamp(28px, 4.2vw, 40px); font-weight: 800; }
.title-md { font-size: clamp(22px, 3vw, 26px); font-weight: 700; }
.lead { font-size: clamp(17px, 2vw, 19px); color: var(--g700); line-height: 1.65; }
.sub { color: var(--g600); font-size: 15px; }
.muted { color: var(--g500); font-size: 13px; }
.demo-badge { justify-self: start; width: fit-content; display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: var(--g600); background: var(--g100); border-radius: 999px; padding: 4px 10px; }
.demo-badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--g400); }
.chip { display: inline-flex; align-items: center; gap: 4px; height: 36px; padding: 0 14px; border-radius: 999px; background: var(--g100); color: var(--g700); font-size: 14px; font-weight: 600; transition: background .15s, color .15s; }
.chip:hover { background: var(--g200); }
.chip.on { background: var(--g900); color: #fff; }
.tag { display: inline-block; font-size: 12.5px; font-weight: 600; padding: 3px 8px; border-radius: 6px; background: var(--g100); color: var(--g700); }
.tag.blue { background: var(--blue-50); color: var(--blue-d); }
.tag.yellow { background: #fff4d6; color: #a86b00; }
.card { background: #fff; border-radius: var(--r); box-shadow: var(--shadow); }
.page-head { padding: 48px 0 28px; display: grid; gap: 10px; }

/* ---------- 홈: 히어로 ---------- */
.hero { padding: 56px 0 72px; overflow: hidden; }
.hero-grid { display: grid; grid-template-columns: 1.05fr 1fr; gap: 40px; align-items: center; }
.hero-copy { display: grid; gap: 22px; }
.hero-cta { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
.hero-art { position: relative; aspect-ratio: 1 / 1; max-width: 480px; width: 100%; justify-self: center; }
.hero-art .bg { position: absolute; inset: 6% 4% 0; border-radius: 40px; background: linear-gradient(180deg, #eef5ff 0%, #f7fbff 100%); }
.hero-art svg.bld { position: absolute; inset: 0; width: 100%; height: 100%; }
.float-chip { position: absolute; display: flex; align-items: center; gap: 10px; background: #fff; border-radius: 16px; padding: 10px 14px; box-shadow: var(--shadow-lg); font-size: 14px; font-weight: 600; white-space: nowrap; animation: floaty 5s ease-in-out infinite; }
.float-chip .em { font-size: 20px; }
.float-chip small { display: block; font-size: 12px; font-weight: 500; color: var(--g600); }
.float-chip.c1 { top: 12%; left: -4%; }
.float-chip.c2 { top: 40%; right: -6%; animation-delay: -1.6s; }
.float-chip.c3 { bottom: 10%; left: 2%; animation-delay: -3.2s; }
@keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

.win { fill: var(--win-off); }
.win.lit { animation: lit .6s ease-out forwards; }
@keyframes lit { to { fill: var(--win-on); } }
.glow { opacity: 0; }
.win.lit + .glow { animation: glow .6s ease-out forwards; }
@keyframes glow { to { opacity: 0.55; } }
@media (prefers-reduced-motion: reduce) {
  .float-chip { animation: none; }
  .win.lit { animation: none; fill: var(--win-on); }
  .win.lit + .glow { animation: none; opacity: .55; }
}

/* 숫자 띠 */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.stat { background: var(--g50); border-radius: var(--r); padding: 26px 24px; display: grid; gap: 6px; }
.stat .n { font-size: clamp(32px, 4vw, 40px); font-weight: 800; letter-spacing: -0.04em; color: var(--g900); line-height: 1.15; }
.stat .n small { font-size: 0.55em; font-weight: 700; margin-left: 2px; }
.stat .n.blue { color: var(--blue); }
.stat p { color: var(--g700); font-size: 15px; }
.stat .muted { margin-top: 4px; }

/* 이용 단계 */
.steps3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-top: 40px; }
.step-card { background: #fff; border-radius: var(--r-lg); padding: 28px; display: grid; gap: 14px; align-content: start; box-shadow: var(--shadow); }
.step-num { width: 34px; height: 34px; border-radius: 50%; background: var(--blue-50); color: var(--blue); display: grid; place-items: center; font-weight: 800; font-size: 15px; }
.step-card h3 { font-size: 20px; }
.step-card p { color: var(--g700); font-size: 15.5px; }
.mini-ui { background: var(--g50); border-radius: 14px; padding: 14px; font-size: 14px; color: var(--g800); display: grid; gap: 8px; }
.mini-ui .line { background: #fff; border-radius: 10px; padding: 10px 12px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
.mini-ui .bar { height: 8px; border-radius: 4px; background: var(--g200); overflow: hidden; }
.mini-ui .bar i { display: block; height: 100%; background: var(--blue); border-radius: 4px; }

/* AI 기능 */
.features { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 40px; }
.feature { background: var(--g50); border-radius: var(--r-lg); padding: 30px; display: grid; gap: 10px; align-content: start; transition: transform .2s, box-shadow .2s; }
.feature:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); background: #fff; }
.feature .ico { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; font-size: 26px; background: #fff; box-shadow: var(--shadow); margin-bottom: 6px; }
.feature h3 { font-size: 21px; }
.feature p { color: var(--g700); font-size: 15.5px; }
.feature .go { color: var(--blue); font-weight: 700; font-size: 15px; margin-top: 4px; }

/* 공간 카드 */
.space-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.space-card { display: grid; background: #fff; border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow); transition: transform .2s, box-shadow .2s; }
.space-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
.space-card .thumb { aspect-ratio: 16 / 10; background: var(--g100); position: relative; }
.space-card .thumb svg { width: 100%; height: 100%; }
.space-card .thumb .tag { position: absolute; left: 12px; top: 12px; background: rgba(255,255,255,.92); }
.space-card .body { padding: 16px 18px 18px; display: grid; gap: 6px; }
.space-card h3 { font-size: 17px; }
.space-card .meta { color: var(--g600); font-size: 14px; }
.space-card .price { font-size: 18px; font-weight: 800; }
.space-card .price small { font-size: 13px; color: var(--g600); font-weight: 500; margin-left: 4px; }
.space-card .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }

/* 건물주 띠 */
.host-band { background: var(--g900); color: #fff; border-radius: var(--r-lg); padding: 44px; display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: center; }
.host-band p { color: var(--g400); margin-top: 8px; }
.host-band .btn-primary { background: #fff; color: var(--g900); }
.host-band .btn-primary:hover { background: var(--g100); }

/* ---------- 공간 찾기 ---------- */
.notice { display: flex; gap: 10px; align-items: flex-start; background: var(--g50); border-radius: var(--r-sm); padding: 12px 14px; font-size: 14px; color: var(--g700); }
.notice b { color: var(--g900); }
.filters { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.finder { display: grid; grid-template-columns: 400px minmax(0, 1fr); gap: 20px; margin-top: 18px; align-items: start; }
.finder-list { display: grid; gap: 12px; max-height: 680px; overflow-y: auto; padding: 2px 4px 4px 2px; }
.list-item { display: grid; grid-template-columns: 104px minmax(0, 1fr); gap: 14px; background: #fff; border-radius: var(--r); padding: 12px; box-shadow: var(--shadow); border: 2px solid transparent; transition: border-color .15s; text-align: left; width: 100%; }
.list-item.on { border-color: var(--blue); }
.list-item .thumb { border-radius: 12px; overflow: hidden; aspect-ratio: 1; background: var(--g100); }
.list-item .thumb svg { width: 100%; height: 100%; }
.list-item h3 { font-size: 16px; }
.list-item .meta { color: var(--g600); font-size: 13.5px; }
.list-item .price { font-weight: 800; font-size: 16px; }
.list-item .price small { font-weight: 500; color: var(--g600); font-size: 12.5px; margin-left: 3px; }
.map-wrap { position: sticky; top: 84px; background: #eef2f6; border-radius: var(--r-lg); overflow: hidden; }
.map-wrap svg { width: 100%; height: auto; }
.map-legend { position: absolute; left: 14px; bottom: 14px; display: flex; gap: 12px; background: rgba(255,255,255,.94); border-radius: 12px; padding: 8px 12px; font-size: 12.5px; color: var(--g700); box-shadow: var(--shadow); }
.map-legend span { display: inline-flex; align-items: center; gap: 6px; }
.map-legend i { width: 12px; height: 12px; border-radius: 4px; background: var(--blue); }
.map-legend i.cand { background: transparent; border: 2px dashed var(--g500); border-radius: 50%; }
.pin { cursor: pointer; }
.pin rect, .pin path { transition: fill .15s; }
.pin.on rect, .pin.on path { fill: var(--g900); }
.pin:focus-visible { outline: none; }
.pin:focus-visible rect { stroke: var(--blue-100); stroke-width: 4; }
.empty { text-align: center; color: var(--g600); padding: 40px 0; }

/* ---------- 상세 ---------- */
.back { display: inline-flex; align-items: center; gap: 4px; color: var(--g600); font-weight: 600; font-size: 15px; margin-top: 28px; }
.detail { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 32px; margin: 18px 0 80px; align-items: start; }
.detail-hero { border-radius: var(--r-lg); overflow: hidden; aspect-ratio: 16 / 9; background: var(--g100); }
.detail-hero svg { width: 100%; height: 100%; }
.spec { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 22px; }
.spec div { background: var(--g50); border-radius: 14px; padding: 14px; }
.spec dt { font-size: 13px; color: var(--g600); }
.spec dd { margin: 2px 0 0; font-weight: 700; font-size: 17px; }
.box { background: var(--g50); border-radius: var(--r-lg); padding: 24px; display: grid; gap: 14px; }
.box h3 { font-size: 19px; display: flex; align-items: center; gap: 8px; }
.ai-mark { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; color: var(--blue-d); background: var(--blue-50); border-radius: 6px; padding: 2px 7px; }
.fit { display: grid; gap: 10px; }
.fit-row { display: grid; grid-template-columns: 6.5em minmax(0, 1fr) 3em; gap: 10px; align-items: center; font-size: 14.5px; }
.fit-row .track { height: 10px; border-radius: 5px; background: var(--g200); overflow: hidden; }
.fit-row .track i { display: block; height: 100%; border-radius: 5px; background: var(--blue); }
.fit-row b { text-align: right; font-variant-numeric: tabular-nums; }
.side { position: sticky; top: 84px; display: grid; gap: 14px; }
.side .card { padding: 24px; display: grid; gap: 14px; }
.side .big { font-size: 30px; font-weight: 800; letter-spacing: -0.03em; }
.side .big small { font-size: 15px; color: var(--g600); font-weight: 500; margin-left: 4px; }
.kv { display: grid; gap: 8px; font-size: 14.5px; }
.kv div { display: flex; justify-content: space-between; gap: 12px; }
.kv span { color: var(--g600); }
.kv b { font-weight: 600; }
.nearby { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.nearby div { background: #fff; border-radius: 12px; padding: 12px; text-align: center; }
.nearby b { display: block; font-size: 20px; }
.nearby span { font-size: 12.5px; color: var(--g600); }

/* ---------- 한 줄 요청 ---------- */
.req-wrap { max-width: 720px; margin: 0 auto; padding: 56px 0 96px; display: grid; gap: 22px; }
.req-input { background: var(--g50); border-radius: var(--r-lg); padding: 22px; display: grid; gap: 14px; border: 2px solid transparent; transition: border-color .15s, background .15s; }
.req-input:focus-within { border-color: var(--blue); background: #fff; }
.req-input textarea { width: 100%; min-height: 84px; resize: none; border: 0; background: transparent; font: inherit; font-size: 20px; font-weight: 600; color: var(--g900); line-height: 1.5; outline: none; }
.req-input textarea::placeholder { color: var(--g400); }
.req-bottom { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.examples { display: flex; gap: 8px; flex-wrap: wrap; }
.parsed { display: flex; gap: 8px; flex-wrap: wrap; }
.loading { display: grid; gap: 12px; padding: 8px 0; }
.load-step { display: flex; align-items: center; gap: 12px; color: var(--g500); font-size: 16px; font-weight: 600; transition: color .2s; }
.load-step .dot { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--g300); display: grid; place-items: center; flex: none; transition: background .2s, border-color .2s; }
.load-step.on { color: var(--g900); }
.load-step.on .dot { border-color: var(--blue); border-top-color: transparent; animation: spin .8s linear infinite; }
.load-step.done { color: var(--g900); }
.load-step.done .dot { background: var(--blue); border-color: var(--blue); animation: none; }
.load-step.done .dot::after { content: ""; width: 10px; height: 6px; border-left: 2.5px solid #fff; border-bottom: 2.5px solid #fff; transform: rotate(-45deg) translate(1px, -1px); }
@keyframes spin { to { transform: rotate(360deg); } }
.match { display: grid; grid-template-columns: 88px minmax(0, 1fr) auto; gap: 14px; align-items: center; background: #fff; border-radius: var(--r); padding: 12px; box-shadow: var(--shadow); }
.match .thumb { border-radius: 12px; overflow: hidden; aspect-ratio: 1; }
.match .thumb svg { width: 100%; height: 100%; }
.match h3 { font-size: 16.5px; }
.match p { font-size: 13.5px; color: var(--g600); }
.score { text-align: center; padding: 0 8px; }
.score b { display: block; font-size: 22px; color: var(--blue); font-weight: 800; }
.score span { font-size: 12px; color: var(--g600); }
.match.best { border: 2px solid var(--blue); }
.proposal { background: #fff; border: 1px solid var(--g200); border-radius: var(--r-lg); padding: 26px; display: grid; gap: 14px; }
.proposal-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }

.actions { display: flex; gap: 10px; flex-wrap: wrap; }

/* ---------- 홍보 키트 ---------- */

.poster { aspect-ratio: 3 / 4; border-radius: var(--r-lg); padding: 28px; display: grid; align-content: space-between; color: #fff; background: linear-gradient(160deg, #3182f6 0%, #1b4fa8 100%); box-shadow: var(--shadow-lg); position: relative; overflow: hidden; }

/* ---------- 리포트 ---------- */

.kpi4 > div { background: var(--g50); border-radius: var(--r); padding: 20px; display: grid; gap: 4px; }
.kpi4 span { font-size: 14px; color: var(--g600); }

.hbars { display: grid; gap: 10px; }

.hbar span { color: var(--g700); }

/* ---------- 건물주 ---------- */
.host-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 40px; padding: 56px 0 96px; align-items: start; }
.benefits { display: grid; gap: 14px; margin-top: 28px; }

.benefit p { color: var(--g700); font-size: 15px; }
.form { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; padding: 28px; min-width: 0; }
.field { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; min-width: 0; }
.field input, .field select { width: 100%; min-width: 0; }

.field input, .field select { height: 52px; border-radius: 14px; border: 1px solid var(--g200); background: var(--g50); padding: 0 14px; font: inherit; font-size: 16px; color: var(--g900); transition: border-color .15s, background .15s; }

.two-col { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 720px) { .form { padding: 22px; } }

/* ---------- 데이터 ---------- */

.policy-card { background: var(--blue-50); }

.dflow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin-top: 18px; font-size: 14.5px; font-weight: 600; color: var(--g700); }

.dnav { position: sticky; top: 64px; z-index: 40; background: rgba(255, 255, 255, .92); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); margin-top: 16px; padding: 10px 0; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.dnav::-webkit-scrollbar { display: none; }

.dchap { padding-top: 72px; scroll-margin-top: 120px; display: grid; gap: 20px; }

.takeaway { display: flex; gap: 10px; align-items: flex-start; background: var(--g900); color: #fff; border-radius: var(--r); padding: 16px 20px; font-size: 15.5px; font-weight: 600; line-height: 1.6; }

.caveat { font-size: 13px; color: var(--g600); background: #fff; border: 1px dashed var(--g300); border-radius: var(--r-sm); padding: 10px 12px; }

.pbars { display: grid; gap: 14px; }
.pbar { display: grid; grid-template-columns: 7em minmax(0, 1fr); gap: 10px; align-items: center; font-size: 14px; }
.pbar > span { color: var(--g700); }
.pbar .two { display: grid; gap: 4px; }
.pbar .row { display: grid; grid-template-columns: minmax(0, 1fr) 4.2em; gap: 8px; align-items: center; }

.pbar .row.gw i { background: var(--blue); }

.pbar .row.gw b { color: var(--blue); }
.pbar .gap { font-size: 12px; color: var(--red); font-weight: 700; }
.legend { display: flex; gap: 14px; font-size: 13px; color: var(--g600); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend span::before { content: ""; width: 10px; height: 10px; border-radius: 3px; background: var(--g300); }
.legend span.gw::before { background: var(--blue); }
.cols { display: flex; align-items: flex-end; gap: 6px; height: 170px; padding-top: 22px; border-bottom: 1px solid var(--g300); }
.cols div { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 700; color: var(--g700); font-variant-numeric: tabular-nums; }
.cols i { display: block; width: 100%; max-width: 34px; border-radius: 6px 6px 0 0; background: var(--blue-100); }
.cols div.last i { background: var(--blue); }
.cols div.last { color: var(--blue); }
.cols .brk { flex: 0 0 18px; justify-content: center; color: var(--g400); font-size: 14px; }
.cols-x { display: flex; gap: 6px; font-size: 11px; color: var(--g500); text-align: center; margin-top: 6px; }
.cols-x span { flex: 1; }
.cols-x .brk { flex: 0 0 18px; }
.dbars { display: grid; gap: 10px; }
.dbar { display: grid; grid-template-columns: 8.5em minmax(0, 1fr) 4.4em; gap: 10px; align-items: center; font-size: 14px; }
.dbar > span { color: var(--g700); }
.dbar .axis { position: relative; height: 14px; }
.dbar .axis::before { content: ""; position: absolute; left: 20%; top: -4px; bottom: -4px; border-left: 1px solid var(--g400); }

.dbar .axis i.neg { right: 80%; background: var(--red); border-radius: 6px 0 0 6px; opacity: .85; }

.dbar b { text-align: right; font-variant-numeric: tabular-nums; }
.dbar b.neg { color: var(--red); }
.dbar b.pos { color: var(--green); }
.dbar-group { font-size: 12.5px; font-weight: 700; color: var(--g500); margin-top: 6px; }
.vs { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.vs .big + span { font-size: 15px; color: var(--g600); font-weight: 600; }
.rank-list { display: grid; gap: 8px; padding: 0; margin: 0; }
.rank-list li { list-style: none; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; background: #fff; border-radius: var(--r-sm); padding: 10px 14px; font-size: 14.5px; }
.rank-list .rk { font-size: 12px; font-weight: 800; border-radius: 6px; padding: 2px 8px; }
.rank-list .rk.top { background: var(--blue-50); color: var(--blue-d); }
.rank-list .rk.low { background: #ffeef0; color: var(--red); }
.rank-list b { font-variant-numeric: tabular-nums; font-size: 14px; }
.rank-list b small { color: var(--g500); font-weight: 500; margin-left: 4px; }
.mini3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.mini3 div { background: #fff; border-radius: var(--r-sm); padding: 12px; display: grid; gap: 2px; }
.mini3 b { font-size: 22px; font-weight: 800; letter-spacing: -0.03em; color: var(--g900); }
.mini3 span { font-size: 12.5px; color: var(--g600); }
.timeline { display: grid; gap: 0; margin: 4px 0; padding: 0; }
.timeline li { list-style: none; display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; padding: 8px 0; border-left: 2px solid var(--blue-100); margin-left: 6px; padding-left: 16px; position: relative; font-size: 14.5px; color: var(--g800); }
.timeline li::before { content: ""; position: absolute; left: -6px; top: 13px; width: 10px; height: 10px; border-radius: 50%; background: var(--blue); }
.timeline li b { color: var(--blue-d); }
.bridge { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.bridge .bcard { background: #fff; border-radius: var(--r-lg); box-shadow: var(--shadow); padding: 26px; display: grid; gap: 12px; align-content: start; }
.bridge .who { font-size: 13px; font-weight: 700; color: var(--g500); }
.bridge .pain { font-size: 15px; color: var(--g700); background: var(--g50); border-radius: var(--r-sm); padding: 10px 12px; }
.bridge .pain b { color: var(--g900); }
.bridge h3 { font-size: 19px; display: flex; gap: 8px; align-items: baseline; }
.bridge h3::before { content: "→"; color: var(--blue); }
.bridge p { font-size: 15px; color: var(--g700); }
.bridge .num { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; font-weight: 800; font-size: 22px; letter-spacing: -0.03em; color: var(--blue); }
.bridge .num s { color: var(--g400); font-weight: 600; font-size: 16px; }
.bridge .num .demo-badge { font-size: 11.5px; letter-spacing: 0; }
.dcta { margin: 72px 0 96px; background: var(--g50); border-radius: var(--r-lg); padding: 36px; display: grid; gap: 16px; }
.dcta .row { display: flex; flex-wrap: wrap; gap: 10px; }
.ctags { display: flex; flex-wrap: wrap; gap: 6px; }
.ctag { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; color: #0f3d6e; background: #fff; border: 1px solid var(--blue-100); border-radius: 999px; padding: 3px 10px; cursor: pointer; transition: background .15s; }
.ctag::before { content: "개념"; font-size: 10.5px; color: var(--blue); }
.ctag:hover { background: var(--blue-50); }
.caveat .ctag { margin-left: 4px; vertical-align: middle; }
.mcard { background: #fff; border: 1px solid var(--g200); scroll-margin-top: 130px; }
.mcard:target, .mcard.flash { box-shadow: 0 0 0 3px var(--blue-100); }
.mtag { justify-self: start; font-size: 12.5px; font-weight: 800; color: #fff; background: #0f3d6e; border-radius: 6px; padding: 3px 10px; }
.mlist { display: grid; gap: 8px; padding: 0; margin: 0; }
.mlist li { list-style: none; font-size: 14.5px; color: var(--g700); line-height: 1.6; padding-left: 12px; border-left: 2px solid var(--blue-100); }
.mlist li > b:first-child { display: block; color: var(--g900); font-size: 14px; }
.mcard .mini3 div { background: var(--g50); }
.vtable-wrap { overflow-x: auto; }
.vtable { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 560px; }
.vtable th { text-align: left; font-size: 12.5px; color: var(--g500); font-weight: 700; padding: 8px 10px; border-bottom: 2px solid var(--g200); }
.vtable td { padding: 9px 10px; border-bottom: 1px solid var(--g100); vertical-align: top; color: var(--g700); }
.vtable td:first-child { color: var(--g500); text-decoration: line-through; text-decoration-color: var(--g300); }
.vtable td b { color: var(--blue-d); }
.vtable tr.grp td { text-decoration: none; color: var(--g900); font-weight: 800; font-size: 13px; padding-top: 18px; background: none; }
.cols div.est i { background: repeating-linear-gradient(135deg, var(--blue-100) 0 4px, #fff 4px 7px); border: 1.5px dashed var(--blue); border-bottom: 0; }
.cols div.last.est i { background: repeating-linear-gradient(135deg, var(--blue) 0 4px, var(--blue-100) 4px 7px); }
.cols em { font-style: normal; font-size: 10px; font-weight: 700; color: #a86b00; background: #fff4d6; border-radius: 4px; padding: 0 4px; }
.cols-legend { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--g600); }
.cols-legend i { width: 12px; height: 12px; border-radius: 3px; border: 1.5px dashed var(--blue); background: repeating-linear-gradient(135deg, var(--blue-100) 0 3px, #fff 3px 5px); }
/* ---------- 로드맵 ---------- */
.rm-track { list-style: none; padding: 0; margin: 8px 0 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); position: sticky; top: 64px; z-index: 40; background: rgba(255, 255, 255, .94); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
.rm-track li { position: relative; }
.rm-track li::before { content: ""; position: absolute; top: 27px; left: -50%; width: 100%; height: 3px; background: var(--g200); }
.rm-track li:first-child::before { display: none; }
.rm-track li.done::before, .rm-track li.now::before { background: var(--blue); }
.rm-track button { position: relative; width: 100%; display: grid; justify-items: center; gap: 2px; padding: 12px 4px; border-radius: 12px; }
.rm-track button:hover, .rm-track button.on { background: var(--g50); }
.rm-dot { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-size: 14px; font-weight: 800; background: #fff; border: 3px solid var(--g300); color: var(--g500); }
.rm-track .done .rm-dot { background: var(--blue); border-color: var(--blue); color: #fff; }
.rm-track .now .rm-dot { border-color: var(--blue); color: var(--blue); box-shadow: 0 0 0 5px var(--blue-50); }
.rm-track b { font-size: 15px; margin-top: 6px; }
.rm-track small { font-size: 12px; color: var(--g500); font-weight: 600; }
.rm-track .now small { color: var(--blue); }
.rm-sec { padding-top: 64px; scroll-margin-top: 150px; display: grid; gap: 18px; }
.rm-head { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
.rm-head h2 { width: 100%; }
.rm-no { font-size: 14px; font-weight: 800; color: var(--blue); }
.rm-badge { font-size: 12px; font-weight: 700; border-radius: 6px; padding: 2px 8px; }
.rm-badge.done { background: var(--g100); color: var(--g600); }
.rm-badge.now { background: var(--blue); color: #fff; }
.rm-badge.next { background: #fff4d6; color: #a86b00; }
.rm-sec > .lead { font-size: 16.5px; max-width: 760px; }
.rm-grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.rm-fact { background: var(--g50); border-radius: var(--r); padding: 20px; display: grid; gap: 6px; align-content: start; }
.rm-fact span { font-size: 13px; font-weight: 700; color: var(--g500); }
.rm-fact b { font-size: 28px; font-weight: 800; letter-spacing: -0.04em; color: var(--blue); }
.rm-fact p { font-size: 14px; color: var(--g700); }
.rm-plan { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0; background: var(--g50); border-radius: var(--r-lg); overflow: hidden; }
.rm-plan div { padding: 22px 24px; display: grid; gap: 6px; border-bottom: 1px solid var(--g200); }
.rm-plan div:nth-child(odd) { border-right: 1px solid var(--g200); }
.rm-plan div:nth-last-child(-n+2) { border-bottom: 0; }
.rm-plan b { font-size: 13px; color: var(--blue); }
.rm-plan p { font-size: 15.5px; color: var(--g800); font-weight: 600; }
.rm-feats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.rm-feats.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.rm-feat .go { color: var(--blue); font-weight: 700; font-size: 14px; }
.sv-why { background: var(--g900); color: #fff; border-radius: var(--r-lg); padding: 26px 28px; display: grid; gap: 12px; }
.sv-why h3 { font-size: 17px; color: var(--win-on); }
.sv-why ul { margin: 0; padding: 0; display: grid; gap: 10px; }
.sv-why li { list-style: none; font-size: 15px; color: #d6dde6; line-height: 1.6; }
.sv-why li b { color: #fff; margin-right: 8px; }
.sv-note { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--g600); }
.sv-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; align-items: start; }
.sv-card { background: var(--g50); border-radius: var(--r); padding: 22px; display: grid; gap: 12px; }
.sv-card h3 { font-size: 16px; }

@media (max-width: 900px) {
  .rm-grid4, .rm-feats { grid-template-columns: repeat(2, minmax(0, 1fr)); }

}
@media (max-width: 720px) {
  .rm-track { top: 56px; }

}

/* ---------- 휴대폰 속 강원이어라 앱 화면 (실제 앱 색: 남색 #0F3D6E, 초록 #03C75A) ---------- */

/* 매물 썸네일: 해당 층만 강조된 건물 정면 */
function storefront(sp) {
  const floors = 4;
  const fh = 34, top = 30, x0 = 70, w = 180;
  let g = "";
  for (let f = floors; f >= 1; f--) {
    const y = top + (floors - f) * fh;
    const on = f === sp.floor;
    const fill = on ? "#ffd66b" : "#d9e2ee";
    if (f === 1) {
      g += `<rect x="${x0}" y="${y}" width="${w}" height="${fh + 6}" fill="${on ? "#fff4d6" : "#eef3f9"}"/>
        <rect x="${x0 + 14}" y="${y + 8}" width="${w * 0.45}" height="${fh - 8}" rx="3" fill="${fill}"/>
        <rect x="${x0 + w * 0.62}" y="${y + 8}" width="28" height="${fh - 2}" rx="3" fill="#c6d3e4"/>`;
    } else {
      for (let c = 0; c < 4; c++) g += `<rect x="${x0 + 14 + c * 42}" y="${y + 8}" width="30" height="${fh - 14}" rx="4" fill="${fill}"/>`;
    }
    if (on) g += `<rect x="${x0 - 6}" y="${y + 2}" width="${w + 12}" height="${fh - 2}" rx="8" fill="none" stroke="${sp.color}" stroke-width="3"/>`;
  }
  return `<svg viewBox="0 0 320 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <rect width="320" height="200" fill="${sp.color}" opacity=".10"/>
    <circle cx="272" cy="40" r="20" fill="${sp.color}" opacity=".18"/>
    <rect x="${x0}" y="${top - 8}" width="${w}" height="${floors * fh + 14}" rx="8" fill="#fff"/>
    ${g}
    <rect x="0" y="${top + floors * fh + 6}" width="320" height="60" fill="${sp.color}" opacity=".16"/>
  </svg>`;
}

    const update = () => {
      const line = innerHeight * 0.45;
      let i = 0;
      secs.forEach((s, k) => { if (s.getBoundingClientRect().top <= line) i = k; });
      if (innerHeight + scrollY >= document.documentElement.scrollHeight - 4) i = secs.length - 1;
      setFloor(i);
      /* 이용 방법 섹션에서는 가운데 휴대폰이 같은 내용을 보여주므로 오른쪽 요청창을 숨김 */

      location.hash = "#/request";
    });

    return () => { removeEventListener("scroll", onScroll); removeEventListener("resize", onResize); };

/* ---------------- 스르륵 나타나기 + 숫자 올라가기 ---------------- */
function countUp(root, instant) {
  $$(".count", root).forEach(el => {
    const to = +el.dataset.to, dec = +(el.dataset.dec || 0);
    const f = v => v.toLocaleString("ko-KR", { minimumFractionDigits: dec, maximumFractionDigits: dec });
    if (instant) { el.textContent = f(to); return; }
    const t0 = performance.now(), dur = 1100;
    const step = now => { const k = Math.min(1, (now - t0) / dur); el.textContent = f(to * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
    setTimeout(() => { el.textContent = f(to); }, dur + 300);
  });
}
function setupReveal() {
  const els = $$("#main .reveal");
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches || !("IntersectionObserver" in window);
  if (still) { els.forEach(e => { e.classList.add("in"); countUp(e, true); }); return () => {}; }
  els.forEach(e => $$(".count", e).forEach(c => { c.textContent = "0"; }));
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    e.target.classList.add("in"); countUp(e.target); io.unobserve(e.target);
  }), { threshold: 0.12, rootMargin: "0px 0px -6% 0px" });
  els.forEach(e => io.observe(e));
  return () => io.disconnect();
}

function parseReq(t) {
  const sizeM = t.match(/(\d+)\s*평/);
  const wM = t.match(/(\d+)\s*주/);
  const dM = t.match(/(\d+)\s*일/);
  let days = null;
  if (wM) days = +wM[1] * 7;
  else if (dM) days = +dM[1];
  else if (/하루|원데이|주말/.test(t)) days = 1;
  const hit = USE_WORDS.find(([k]) => t.includes(k));
  return { size: sizeM ? +sizeM[1] : null, days, use: hit ? hit[1] : null, text: t };
}
function rank(q) {
  return SPACES.map(sp => {
    let s = 62;
    if (q.use && sp.uses.includes(q.use)) s += 18 - sp.uses.indexOf(q.use) * 4;
    if (q.size) s += Math.max(0, 14 - Math.abs(q.size - sp.size) * 2);
    else s += 6;
    if (q.days) s += (q.days >= sp.minDays && q.days <= sp.maxDays) ? 6 : -14;
    return { sp, score: Math.max(41, Math.min(97, s)) };
  }).sort((a, b) => b.score - a.score).slice(0, 3);
}
function reason(q, sp) {
  const r = [];
  if (q.use && sp.uses.includes(q.use)) r.push(`${USE_LABEL[q.use]}에 맞는 구조`);
  if (q.size) r.push(Math.abs(q.size - sp.size) <= 3 ? "원하는 크기와 비슷" : `${sp.size}평`);
  if (q.days) r.push(q.days >= sp.minDays && q.days <= sp.maxDays ? `${dayText(q.days)} 대여 가능` : `최소 ${dayText(sp.minDays)}부터`);
  r.push(sp.feats[0]);
  return r.slice(0, 3).join(" · ");
}
function proposal(q, sp) {
  const use = USE_LABEL[q.use] || "팝업";
  const days = q.days || 14;
  const fee = Math.round((sp.price[0] + sp.price[1]) / 2 * 10) / 10;
  return `안녕하세요, ${sp.name} 건물주님.
강원이어라를 통해 ${dayText(days)} 동안 공간을 빌려 ${use}${eulReul(use)} 열고 싶은 청년 창업팀입니다.

■ 제안 내용
· 기간: ${dayText(days)} (평일 11시~20시, 주말 12시~21시)
· 용도: ${use} — "${q.text}"
· 대여료: 하루 ${fee}만원, 총 ${Math.round(fee * days)}만원 (강원이어라 추천가 기준)

■ 이 공간을 고른 이유
${sp.note} 주변에 음식점·소매가 많아 지나가는 사람이 많고, 같은 업종 경쟁은 적습니다.

■ 약속드리는 것
· 원상복구 보증금을 강원이어라에 맡기고, 입점 전후 사진으로 상태를 확인합니다.
· 영업신고 등 필요한 절차는 오픈 전에 마칩니다.

비어 있는 기간 동안 공간을 알리는 기회가 되도록 정성껏 운영하겠습니다.`;
}

    mount() {
      const chips = $$(".dnav .chip");
      $$("#main [data-chap]").forEach(c => c.addEventListener("click", () => {
        const t = document.getElementById(c.dataset.chap);
        t.scrollIntoView({ behavior: "smooth", block: "start" });
        if (t.classList.contains("mcard")) { t.classList.add("flash"); setTimeout(() => t.classList.remove("flash"), 1800); }
      }));
      if (!("IntersectionObserver" in window)) return;
      const io = new IntersectionObserver(es => es.forEach(e => {
        if (!e.isIntersecting) return;
        chips.forEach(c => c.classList.toggle("on", c.dataset.chap === e.target.id));
      }), { rootMargin: "-40% 0px -55% 0px" });
      CHAPTERS.forEach(([id]) => io.observe(document.getElementById(id)));
      return () => io.disconnect();
    }
  };
};

          ${Q("공간 이용 의향", [
            ["단기로 공간을 빌린다면 어떤 용도로 쓰고 싶나요?", "생일카페·굿즈 / 전시 / 공방·클래스 / 음식·브랜드 팝업 / 기타"],
            ["원하는 대여 기간은 얼마인가요?", "하루 / 2~3일 / 1주 / 2주 / 4주"],
            ["하루 대여료로 낼 수 있는 금액은?", "3만 원 미만 / 3~5만 / 5~8만 / 8~12만 / 12만 원 이상"],
            ["공간을 고를 때 가장 중요하게 보는 것은?", "위치 / 가격 / 크기 / 층수·통창 / 설비"]
          ])}
          ${Q("창업·팝업 경험", [
            ["창업이나 팝업을 해 봤거나 해 보고 싶은 적이 있나요?", "해 봤다 / 해 보고 싶다 / 관심 없다"],
            ["망설였다면 가장 큰 이유는?", "초기 비용 / 실패 부담 / 공간 찾기 / 계약 절차 / 홍보"],
            ["짧게 빌려 먼저 해 볼 수 있다면 도전할 의향이 있나요?", "5점 척도"]
          ])}
          ${Q("원도심 인식", [
            ["춘천 명동·원주 중앙동 같은 원도심에 얼마나 자주 가나요?", "주 1회 이상 / 월 1~3회 / 거의 안 감"],
            ["빈 상가에 팝업·전시가 열리면 들러 볼 의향이 있나요?", "5점 척도"],
            ["원도심이 다시 붐비려면 무엇이 필요하다고 생각하나요?", "자유 응답"]
          ])}
        </div>
        <div class="sv-flow reveal">
          <div><b>설계</b><span>문항 확정</span></div><i aria-hidden="true">›</i>
          <div><b>배포</b><span>SNS로 온라인 설문 공유 (청년·대학생 중심)</span></div><i aria-hidden="true">›</i>
          <div><b>분석</b><span>응답 정리, 기획 내용과 비교</span></div><i aria-hidden="true">›</i>
          <div><b>반영</b><span>대여료·기간·안심 장치 조정</span></div>
        </div>
      </section>

      <div class="dcta reveal">
        <h2 class="title-md">지금 구현된 기능부터 써 보세요</h2>
        <div class="row">
          <a class="btn btn-primary" href="#/request">한 줄로 공간 요청하기</a>
          <a class="btn btn-grey" href="#/spaces">공간 둘러보기</a>
        </div>
      </div>
    </div>`,
    mount() {
      kit.mount && kit.mount();
      rep.mount && rep.mount();
      const tabs = $$(".pv-tabs [data-pv]");
      const pick = k => {
        tabs.forEach(t => { const on = t.dataset.pv === k; t.classList.toggle("on", on); t.setAttribute("aria-selected", String(on)); });
        $$(".pv[data-panel]").forEach(el => { el.hidden = el.dataset.panel !== k; });
      };
      tabs.forEach(t => t.addEventListener("click", () => pick(t.dataset.pv)));
      pick(focus === "report" ? "report" : "kit");
      if (focus) setTimeout(() => document.getElementById("r4").scrollIntoView({ behavior: "smooth", block: "start" }), 80);
      const steps = $$(".rm-track button");
      $$("#main [data-chap]").forEach(c => c.addEventListener("click", () => document.getElementById(c.dataset.chap).scrollIntoView({ behavior: "smooth", block: "start" })));
      if (!("IntersectionObserver" in window)) return;
      const io = new IntersectionObserver(es => es.forEach(e => {
        if (e.isIntersecting) steps.forEach(s => s.classList.toggle("on", s.dataset.chap === e.target.id));
      }), { rootMargin: "-40% 0px -55% 0px" });
      STAGES.forEach(([id]) => io.observe(document.getElementById(id)));
      return () => io.disconnect();
    }
  };
};

pages.notfound = () => ({
  html: `<div class="container" style="padding:96px 0;text-align:center;display:grid;gap:16px;justify-items:center">
    <h1 class="title-lg">페이지를 찾을 수 없어요</h1>
    <a class="btn btn-primary" href="#/">홈으로</a>
  </div>`
});

/* ---------------- 라우터 ---------------- */
let cleanups = [];
function render() {
  cleanups.forEach(f => f()); cleanups = [];
  const [name = "", arg] = location.hash.replace(/^#\/?/, "").split("/");
  const key = name || "home";
  const page = pages[key] ? pages[key](arg) : pages.notfound();
  const main = $("#main");
  main.innerHTML = page.html;
  main.firstElementChild && main.firstElementChild.classList.add("fade-in");
  const c = page.mount && page.mount();
  if (typeof c === "function") cleanups.push(c);
  cleanups.push(setupReveal());
  const navKey = key === "space" ? "spaces" : key;
  $$("[data-nav]").forEach(a => a.classList.toggle("on", a.dataset.nav === navKey));
  if (navKey === "kit" || navKey === "report") $('.topnav [data-nav="roadmap"]').classList.add("on");
  window.scrollTo({ top: 0, behavior: "instant" });
  const titles = { home: "강원이어라 · 강원 원도심 빈 상가와 청년을 잇는 공간 매칭", spaces: "공간 찾기 · 강원이어라", space: "공간 상세 · 강원이어라", request: "한 줄 요청 · 강원이어라", kit: "홍보 키트 · 강원이어라", report: "성과 리포트 · 강원이어라", roadmap: "로드맵 · 강원이어라", host: "공간 등록 · 강원이어라", data: "왜 강원이어라인가 · 강원이어라" };
  document.title = titles[key] || "강원이어라";
}
window.addEventListener("hashchange", render);
// 미리보기 창(iframe srcdoc)에서는 href="#/..."가 바깥 페이지 주소 기준으로 풀려 화면이 깨진다.
// 그래서 페이지 안 링크는 기본 이동을 막고 해시만 직접 바꾼다. 일반 브라우저에서도 동작은 같다.
document.addEventListener("click", e => {
  const a = e.target.closest('a[href^="#"]');
  if (!a || e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
  e.preventDefault();
  const h = a.getAttribute("href");
  if (h === "#main") { $("#main").focus(); return; }
  if (location.hash === h || (h === "#/" && location.hash === "")) render();
  else location.hash = h;
});
// 미리보기 창(샌드박스 iframe)은 폼 제출을 막아서 submit 이벤트가 아예 생기지 않는다.
// 제출 버튼 클릭(Enter 제출 포함)을 가로채 submit 이벤트를 직접 보낸다. 실제 페이지 이동은 원래도 없다.
function submitForm(form) {
  form.dispatchEvent(new Event("submit", { bubbles: true, cancelable: true }));
}
document.addEventListener("click", e => {
  const b = e.target.closest('form button[type="submit"]');
  if (!b || b.disabled) return;
  e.preventDefault();
  submitForm(b.form);
});
window.addEventListener("scroll", () => $(".topbar").classList.toggle("scrolled", scrollY > 4), { passive: true });
render();

</script>
</body>
